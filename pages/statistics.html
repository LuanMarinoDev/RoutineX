<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0B0D0C" />
    <meta name="description" content="Como sua semana está indo." />
    <title>Estatísticas · RoutineX</title>

    <!-- Ícone da aba do navegador. -->
    <link rel="icon" type="image/png" href="../assets/images/LogoNav.png" />
    <link rel="apple-touch-icon" href="../assets/images/LogoNav.png" />

    <!-- Aplica o tema salvo antes da primeira pintura (evita o flash claro). -->
    <script>
      try {
        var read = function (key) {
          return JSON.parse(
            localStorage.getItem("routinex:v2:" + key) ||
              localStorage.getItem("nexora:v2:" + key) ||
              "null"
          );
        };
        var session = read("session");
        var slot = session && session.userId ? session.userId : "guest";
        var saved = read("u:" + slot);
        var theme = (saved && saved.settings && saved.settings.theme) || "dark";
        if (theme === "system") {
          theme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      } catch (error) {
        /* localStorage bloqueado: segue com o tema padrão do HTML. */
      }
    </script>

    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/dashboard.css" />
    <link rel="stylesheet" href="../css/statistics.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
  </head>

  <body data-page="statistics" data-root="../">
    <a class="skip-link" href="#main">Pular para o conteúdo</a>

    <div class="app">
      <div id="shell-sidebar"></div>

      <div class="app__main">
        <div id="shell-topbar"></div>

        <main id="main" class="content">
          <div class="page-head">
            <div>
              <p class="eyebrow" data-range-label>Os últimos 7 dias</p>
              <h1 class="page-head__title">Estatísticas</h1>
            </div>

            <div id="stats-range"></div>
          </div>

          <!-- Um cartão só; o conteúdo é pintado por js/pages/statistics.js -->
          <section class="stats-panel page-panel" aria-label="Painel de estatísticas">
            <section class="panel panel--hero" id="stats-hero" aria-label="Tempo por categoria"></section>

            <aside class="stats-rail" id="stats-rail" aria-label="Constância"></aside>

            <div class="stats-grid" id="stats-grid"></div>

            <section class="panel panel--chart" id="stats-chart" aria-label="Atividades por dia"></section>

            <div class="stats-banner" id="stats-banner"></div>
          </section>
        </main>
      </div>
    </div>

    <div id="toast-region" class="toasts" role="status" aria-live="polite"></div>

    <script type="module" src="../js/app.js"></script>
  </body>
</html>
