<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0B0D0C" />
    <meta name="description" content="Preferências, backup e categorias." />
    <title>Configurações · RoutineX</title>

    <!-- Ícone da aba do navegador. -->
    <link rel="icon" type="image/png" href="../assets/images/LogoNav.png" />
    <link rel="apple-touch-icon" href="../assets/images/LogoNav.png" />

    <!-- Aplica o tema salvo antes da primeira pintura (evita o flash claro). -->
    <script>
      try {
        var read = function (key) {
          return JSON.parse(
            localStorage.getItem("routinex:v2:" + key) ||
              localStorage.getItem("nexora:v2:" + key) ||
              "null"
          );
        };
        var session = read("session");
        var slot = session && session.userId ? session.userId : "guest";
        var saved = read("u:" + slot);
        var theme = (saved && saved.settings && saved.settings.theme) || "dark";
        if (theme === "system") {
          theme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      } catch (error) {
        /* localStorage bloqueado: segue com o tema padrão do HTML. */
      }
    </script>

    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/dashboard.css" />
    <link rel="stylesheet" href="../css/settings.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
  </head>

  <body data-page="settings" data-root="../">
    <a class="skip-link" href="#main">Pular para o conteúdo</a>

    <div class="app">
      <div id="shell-sidebar"></div>

      <div class="app__main">
        <div id="shell-topbar"></div>

        <main id="main" class="content">
          <div class="page-head">
            <div>
              <p class="eyebrow">Preferências</p>
              <h1 class="page-head__title">Configurações</h1>
            </div>
          </div>

          <div class="dash">
            <div class="dash__col">
              <section class="card" aria-labelledby="conta">
                <div class="card__head">
                  <p class="eyebrow" id="conta">Sua conta</p>
                </div>
                <div id="set-account" class="setting"></div>
              </section>

              <section class="card" aria-labelledby="perfil">
                <div class="card__head">
                  <p class="eyebrow" id="perfil">Como te chamar</p>
                </div>
                <div class="field">
                  <label for="user-name">Nome usado na saudação do dashboard</label>
                  <input class="input" id="user-name" type="text" placeholder="Seu nome" autocomplete="given-name" />
                </div>
              </section>

              <section class="card" aria-labelledby="aparencia">
                <div class="card__head">
                  <p class="eyebrow" id="aparencia">Aparência</p>
                </div>
                <div id="set-theme" class="setting"></div>
              </section>

              <section class="card" aria-labelledby="semana">
                <div class="card__head">
                  <p class="eyebrow" id="semana">A semana começa na</p>
                </div>
                <div id="set-week" class="setting"></div>
              </section>
            </div>

            <div class="dash__col">
              <section class="card" aria-labelledby="notif">
                <div class="card__head">
                  <p class="eyebrow" id="notif">Notificações</p>
                </div>
                <div id="set-notifications" class="setting"></div>
              </section>

              <section class="card" aria-labelledby="categorias">
                <div class="card__head">
                  <p class="eyebrow" id="categorias">Categorias</p>
                </div>
                <div id="set-categories" class="setting"></div>
              </section>

              <section class="card" aria-labelledby="dados">
                <div class="card__head">
                  <p class="eyebrow" id="dados">Seus dados</p>
                </div>
                <div id="set-data" class="setting"></div>
              </section>
            </div>
          </div>
        </main>
      </div>
    </div>

    <div id="toast-region" class="toasts" role="status" aria-live="polite"></div>

    <script type="module" src="../js/app.js"></script>
  </body>
</html>
