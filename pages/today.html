<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0B0D0C" />
    <meta name="description" content="A agenda detalhada do seu dia." />
    <title>Hoje · RoutineX</title>

    <!-- Ícone da aba do navegador. -->
    <link rel="icon" type="image/png" href="../assets/images/LogoNav.png" />
    <link rel="apple-touch-icon" href="../assets/images/LogoNav.png" />

    <!-- Aplica o tema salvo antes da primeira pintura (evita o flash claro). -->
    <script>
      try {
        var read = function (key) {
          return JSON.parse(
            localStorage.getItem("routinex:v2:" + key) ||
              localStorage.getItem("nexora:v2:" + key) ||
              "null"
          );
        };
        var session = read("session");
        var slot = session && session.userId ? session.userId : "guest";
        var saved = read("u:" + slot);
        var theme = (saved && saved.settings && saved.settings.theme) || "dark";
        if (theme === "system") {
          theme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      } catch (error) {
        /* localStorage bloqueado: segue com o tema padrão do HTML. */
      }
    </script>

    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/dashboard.css" />
    <link rel="stylesheet" href="../css/calendar.css" />
    <link rel="stylesheet" href="../css/tasks.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
  </head>

  <body data-page="today" data-root="../">
    <a class="skip-link" href="#main">Pular para o conteúdo</a>

    <div class="app">
      <div id="shell-sidebar"></div>

      <div class="app__main">
        <div id="shell-topbar"></div>

        <main id="main" class="content">
          <section class="hero" aria-labelledby="today-title">
            <div>
              <p class="eyebrow">Agenda do dia</p>
              <h1 class="hero__greeting" id="today-title" data-day-title>Hoje</h1>
              <p class="hero__date" data-day-sub>Carregando a data…</p>
            </div>

            <div class="day-nav">
              <button
                class="btn btn--ghost btn--icon"
                type="button"
                data-nav="prev"
                aria-label="Dia anterior"
              >
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
              </button>
              <button class="btn btn--ghost btn--sm" type="button" data-nav="today">
                Hoje
              </button>
              <button
                class="btn btn--ghost btn--icon"
                type="button"
                data-nav="next"
                aria-label="Próximo dia"
              >
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
              </button>
              <button class="btn btn--primary btn--sm" type="button" data-new-here>
                Nova atividade
              </button>
            </div>
          </section>

          <!-- Resumo do dia: preenchido por js/pages/today.js -->
          <section class="card" id="day-summary" aria-label="Resumo do dia"></section>

          <section class="card" aria-label="Linha do tempo do dia">
            <div class="timeline" id="day-timeline">
              <div class="empty">
                <span class="empty__icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span>
                <p class="empty__title">Carregando o dia…</p>
              </div>
            </div>
          </section>

          <!-- Só aparece quando há tarefas com prazo neste dia. -->
          <section class="card" id="day-tasks-section" aria-labelledby="day-tasks-label" hidden>
            <div class="card__head">
              <p class="eyebrow" id="day-tasks-label">Tarefas com prazo neste dia</p>
              <a class="btn btn--quiet btn--sm" href="./tasks.html">Ver todas</a>
            </div>
            <div id="day-tasks"></div>
          </section>
        </main>
      </div>
    </div>

    <div id="toast-region" class="toasts" role="status" aria-live="polite"></div>

    <script type="module" src="../js/app.js"></script>
  </body>
</html>
