<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0B0D0C" />
    <meta name="description" content="O que precisa ser feito, sem hora marcada." />
    <title>Tarefas · RoutineX</title>

    <!-- Ícone da aba do navegador. -->
    <link rel="icon" type="image/png" href="../assets/images/LogoNav.png" />
    <link rel="apple-touch-icon" href="../assets/images/LogoNav.png" />

    <!-- Aplica o tema salvo antes da primeira pintura (evita o flash claro). -->
    <script>
      try {
        var read = function (key) {
          return JSON.parse(
            localStorage.getItem("routinex:v2:" + key) ||
              localStorage.getItem("nexora:v2:" + key) ||
              "null"
          );
        };
        var session = read("session");
        var slot = session && session.userId ? session.userId : "guest";
        var saved = read("u:" + slot);
        var theme = (saved && saved.settings && saved.settings.theme) || "dark";
        if (theme === "system") {
          theme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      } catch (error) {
        /* localStorage bloqueado: segue com o tema padrão do HTML. */
      }
    </script>

    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/tasks.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
  </head>

  <body data-page="tasks" data-root="../">
    <a class="skip-link" href="#main">Pular para o conteúdo</a>

    <div class="app">
      <div id="shell-sidebar"></div>

      <div class="app__main">
        <div id="shell-topbar"></div>

        <main id="main" class="content">
          <div class="page-head">
            <div>
              <p class="eyebrow">Sem hora marcada</p>
              <h1 class="page-head__title">Tarefas</h1>
            </div>

            <button class="btn btn--primary" type="button" data-new-task>
              Nova tarefa
            </button>
          </div>

          <!-- Resumo e filtros: preenchidos por js/pages/tasks.js -->
          <section class="card" id="tasks-summary" aria-label="Resumo das tarefas"></section>

          <div class="toolbar" id="tasks-toolbar" role="group" aria-label="Filtrar tarefas"></div>

          <section class="card" id="tasks-root" aria-label="Lista de tarefas">
            <div class="empty">
              <p class="empty__title">Carregando suas tarefas…</p>
            </div>
          </section>
        </main>
      </div>
    </div>

    <div id="toast-region" class="toasts" role="status" aria-live="polite"></div>

    <script type="module" src="../js/app.js"></script>
  </body>
</html>
