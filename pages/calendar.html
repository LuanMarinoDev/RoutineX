<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0B0D0C" />
    <meta name="description" content="Visualize seu mês, semana e dia." />
    <title>Calendário · RoutineX</title>

    <!-- Ícone da aba do navegador. -->
    <link rel="icon" type="image/png" href="../assets/images/LogoNav.png" />
    <link rel="apple-touch-icon" href="../assets/images/LogoNav.png" />

    <!-- Aplica o tema salvo antes da primeira pintura (evita o flash claro). -->
    <script>
      try {
        var read = function (key) {
          return JSON.parse(
            localStorage.getItem("routinex:v2:" + key) ||
              localStorage.getItem("nexora:v2:" + key) ||
              "null"
          );
        };
        var session = read("session");
        var slot = session && session.userId ? session.userId : "guest";
        var saved = read("u:" + slot);
        var theme = (saved && saved.settings && saved.settings.theme) || "dark";
        if (theme === "system") {
          theme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      } catch (error) {
        /* localStorage bloqueado: segue com o tema padrão do HTML. */
      }
    </script>

    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/calendar.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
  </head>

  <body data-page="calendar" data-root="../">
    <a class="skip-link" href="#main">Pular para o conteúdo</a>

    <div class="app">
      <div id="shell-sidebar"></div>

      <div class="app__main">
        <div id="shell-topbar"></div>

        <main id="main" class="content">
          <div class="page-head">
            <div>
              <p class="eyebrow">Sua rotina no tempo</p>
              <h1 class="page-head__title">Calendário</h1>
            </div>

            <button class="btn btn--primary" type="button" data-action="new-activity">
              Nova atividade
            </button>
          </div>

          <div class="cal-toolbar">
            <div class="cal-nav">
              <button class="btn btn--ghost btn--icon" type="button" data-cal="prev" aria-label="Período anterior">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
              </button>
              <button class="btn btn--ghost btn--sm" type="button" data-cal="today">Hoje</button>
              <button class="btn btn--ghost btn--icon" type="button" data-cal="next" aria-label="Próximo período">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
              </button>
            </div>

            <h2 class="cal-title" id="cal-title">Calendário</h2>

            <div class="topbar__spacer"></div>

            <div class="segmented" role="group" aria-label="Modo de visualização">
              <button type="button" data-view="month" aria-pressed="true">Mês</button>
              <button type="button" data-view="week" aria-pressed="false">Semana</button>
              <button type="button" data-view="day" aria-pressed="false">Dia</button>
            </div>
          </div>

          <!-- Mês, semana ou dia: pintado por js/pages/calendar.js -->
          <section class="card" id="calendar-root" aria-labelledby="cal-title">
            <div class="empty">
              <span class="empty__icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span>
              <p class="empty__title">Carregando o calendário…</p>
            </div>
          </section>
        </main>
      </div>
    </div>

    <div id="toast-region" class="toasts" role="status" aria-live="polite"></div>

    <script type="module" src="../js/app.js"></script>
  </body>
</html>
