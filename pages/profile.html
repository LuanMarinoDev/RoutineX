<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0B0D0C" />
    <meta name="description" content="Seus dados e nível de acesso no RoutineX." />
    <title>Meu perfil · RoutineX</title>

    <!-- Ícone da aba do navegador. -->
    <link rel="icon" type="image/png" href="../assets/images/LogoNav.png" />
    <link rel="apple-touch-icon" href="../assets/images/LogoNav.png" />

    <!-- Aplica o tema salvo antes da primeira pintura (evita o flash claro). -->
    <script>
      try {
        var read = function (key) {
          return JSON.parse(
            localStorage.getItem("routinex:v2:" + key) ||
              localStorage.getItem("nexora:v2:" + key) ||
              "null"
          );
        };
        var session = read("session");
        var slot = session && session.userId ? session.userId : "guest";
        var saved = read("u:" + slot);
        var theme = (saved && saved.settings && saved.settings.theme) || "dark";
        if (theme === "system") {
          theme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      } catch (error) {
        /* localStorage bloqueado: segue com o tema padrão do HTML. */
      }
    </script>

    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/dashboard.css" />
    <link rel="stylesheet" href="../css/settings.css" />
    <link rel="stylesheet" href="../css/account.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
  </head>

  <body data-page="profile" data-root="../">
    <a class="skip-link" href="#main">Pular para o conteúdo</a>

    <div class="app">
      <div id="shell-sidebar"></div>

      <div class="app__main">
        <div id="shell-topbar"></div>

        <main id="main" class="content">
          <!-- Identidade e ações: js/pages/profile.js -->
          <section class="card profile" id="profile-header" aria-label="Sua conta"></section>

          <div class="dash">
            <div class="dash__col">
              <section class="card" aria-labelledby="dados-label">
                <div class="card__head">
                  <p class="eyebrow" id="dados-label">Dados cadastrais</p>
                </div>
                <div id="profile-details"></div>
              </section>

              <section class="card" aria-labelledby="agenda-label">
                <div class="card__head">
                  <p class="eyebrow" id="agenda-label">Sua agenda em números</p>
                </div>
                <div id="profile-activity"></div>
              </section>
            </div>

            <div class="dash__col">
              <section class="card" aria-labelledby="acesso-label">
                <div class="card__head">
                  <p class="eyebrow" id="acesso-label">Nível de acesso</p>
                </div>
                <div id="profile-access" class="setting"></div>
              </section>

              <section class="card card--danger" aria-labelledby="zona-label">
                <div class="card__head">
                  <p class="eyebrow" id="zona-label">Encerrar a conta</p>
                </div>
                <div id="profile-danger" class="setting"></div>
              </section>
            </div>
          </div>
        </main>
      </div>
    </div>

    <div id="toast-region" class="toasts" role="status" aria-live="polite"></div>

    <script type="module" src="../js/app.js"></script>
  </body>
</html>
